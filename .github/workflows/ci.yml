name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: harness tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,judge]"
      - run: ruff check src demo tests
      - run: pytest -q

  gate:
    name: demo replay gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,judge]"

      # The deterministic tier is the one that runs on every push: no model, no
      # cost, no flake. Exit code is the gate.
      - name: Deterministic tier
        run: python -m demo.run_gate

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-report
          path: reports/
