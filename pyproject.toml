[project]
name = "replaygate"
version = "0.1.0"
description = "A pre-deploy regression gate for conversational agents: replay scripted conversations through your real code with every I/O boundary sealed, and fail the build when the deterministic path reaches for the model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "agent", "testing", "regression", "eval", "ci", "replay"]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
judge = ["httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
replaygate = "replaygate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replaygate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
